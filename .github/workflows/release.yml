name: Release

# Triggers on `git tag v* && git push --tags`. Builds, signs, notarises,
# uploads the .dmg + latest.json manifest to a GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # creating releases needs write access to the repo

jobs:
  build-macos:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Cache cargo to keep CI under 5 min once warm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend deps
        working-directory: app
        run: npm ci

      - name: Install sidecar deps
        working-directory: app/sidecar
        run: npm ci

      - name: Build sidecar
        working-directory: app
        run: npm run sidecar:build

      # Restore the Apple Developer ID Application certificate from a
      # base64-encoded p12 stored as a GitHub secret.
      - name: Import Apple signing cert
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 \
            -k build.keychain \
            -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            build.keychain
          rm /tmp/cert.p12

      - name: Tauri build (signs + bundles)
        working-directory: app
        env:
          # Tauri reads these for codesigning
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # Tauri updater signing key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target aarch64-apple-darwin

      # Tauri 2 notarises automatically when APPLE_ID + APPLE_PASSWORD
      # are set. If you want to verify manually:
      # - run: xcrun stapler validate src-tauri/target/.../Replay.app

      - name: Generate latest.json manifest
        id: manifest
        working-directory: app/src-tauri/target/aarch64-apple-darwin/release/bundle
        run: |
          DMG_NAME=$(ls dmg/*.dmg | head -1 | xargs basename)
          SIG_PATH=$(ls dmg/*.dmg.sig | head -1)
          SIGNATURE=$(cat "$SIG_PATH")
          VERSION="${GITHUB_REF#refs/tags/v}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG_NAME}"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the GitHub release notes for changelog.",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIGNATURE}",
                "url": "${DOWNLOAD_URL}"
              }
            }
          }
          EOF

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/latest.json
          generate_release_notes: true
          draft: false
